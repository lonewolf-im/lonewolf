[workspace]
members = [
    "crates/lonewolf",
    "crates/lonewolf-admin",
    "crates/lonewolf-auth",
    "crates/lonewolf-core",
    "crates/lonewolf-storage",
    "crates/lonewolf-util",
    "crates/lonewolf-xmpp",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
async-channel = "2.5.0"
async-lock = "3.4.2"
axum = { version = "0.8.9", default-features = false }
base64 = "0.22.1"
blocking = "1.7.0"
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
compio = { version = "0.19.2", default-features = false, features = ["runtime", "signal", "io-uring", "polling"] }
compio-io = { version = "0.10.1", default-features = false, features = ["compat"] }
crossbeam-queue = "0.3.12"
crossbeam-utils = "0.8.21"
futures-channel = "0.3.34"
futures-executor = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = { version = "0.4.3", default-features = false, features = ["std"] }
graviola = "0.4.1"
hmac = { version = "0.13.0", default-features = false, features = ["zeroize"] }
http-body-util = { version = "0.1.4", default-features = false }
hyper = { version = "1.11.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["service", "tokio"] }
icu_properties = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
idna = "1.1.0"
lonewolf-admin = { path = "crates/lonewolf-admin" }
lonewolf-auth = { path = "crates/lonewolf-auth" }
lonewolf-core = { path = "crates/lonewolf-core" }
lonewolf-storage = { path = "crates/lonewolf-storage" }
lonewolf-util = { path = "crates/lonewolf-util" }
lonewolf-xmpp = { path = "crates/lonewolf-xmpp" }
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
percent-encoding = "2.3.2"
precis-profiles = { version = "0.2.0", default-features = false }
quick-xml = { version = "0.41.0", default-features = false, features = ["async-tokio"] }
redb = { version = "4.3.0", default-features = false, features = ["std"] }
rcgen = { version = "0.14.10", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4.0"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
socket2 = { version = "0.6.5", default-features = false }
stringprep = "0.1.5"
tempfile = { version = "3.27.0", default-features = false }
time = { version = "0.3.53", default-features = false, features = ["formatting", "macros"] }
tokio = { version = "1.53.1", default-features = false, features = ["io-util"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["compat"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-appender = { version = "0.2.5", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "std", "time"] }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }

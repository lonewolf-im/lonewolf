[package]
name = "lonewolf-bench"
description = "Reproducible Unix XMPP workload measurements"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
futures-rustls.workspace = true
getrandom.workspace = true
hmac.workspace = true
graviola.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
lonewolf-auth.workspace = true
lonewolf-metrics.workspace = true
prometheus-client.workspace = true
lonewolf-storage.workspace = true
lonewolf-util.workspace = true
lonewolf-xmpp.workspace = true
nix = { workspace = true, features = ["fs"] }
pbkdf2.workspace = true
rustls.workspace = true
rustls-graviola = { version = "0.4.0", default-features = false }
rcgen.workspace = true
sha2.workspace = true
stringprep.workspace = true
tokio-util.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true
clap.workspace = true
hdrhistogram.workspace = true
http.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
toml.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros", "io-util"] }

[dev-dependencies]
hickory-proto.workspace = true
async-lock.workspace = true
tracing.workspace = true
compio = { workspace = true, features = ["time"] }
futures-executor.workspace = true
idna.workspace = true
lonewolf-acme.workspace = true
lonewolf-core = { workspace = true, features = ["test-support"] }
lonewolf-extension.workspace = true
parking_lot.workspace = true
quick-xml.workspace = true
sha1.workspace = true
socket2.workspace = true
time.workspace = true
x509-cert.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "benchmark_accounts"
path = "../lonewolf-core/tests/benchmark/accounts.rs"

[[test]]
name = "benchmark_remote"
path = "../lonewolf-core/tests/benchmark/remote.rs"

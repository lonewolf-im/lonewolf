[package]
name = "lonewolf-core"
description = "Server configuration and runtime lifecycle for Lonewolf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-support = ["lonewolf-acme/test-support"]

[dependencies]
async-channel.workspace = true
async-lock.workspace = true
base64.workspace = true
compio = { workspace = true, features = ["net", "rustls", "time"] }
crossbeam-utils.workspace = true
futures-channel.workspace = true
futures-rustls.workspace = true
futures-util = { workspace = true, features = ["io"] }
graviola.workspace = true
http.workspace = true
idna.workspace = true
oxilangtag.workspace = true
lonewolf-acme.workspace = true
lonewolf-admin.workspace = true
lonewolf-auth.workspace = true
lonewolf-extension.workspace = true
lonewolf-metrics.workspace = true
lonewolf-storage.workspace = true
lonewolf-util.workspace = true
lonewolf-xmpp.workspace = true
nix = { workspace = true, features = ["user"] }
parking_lot.workspace = true
prometheus-client.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-graviola.workspace = true
serde.workspace = true
socket2.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
tokio-util.workspace = true
webpki.workspace = true
zeroize.workspace = true
x509-cert.workspace = true

[dev-dependencies]
lonewolf-core = { path = ".", features = ["test-support"] }
hmac.workspace = true
pbkdf2.workspace = true
quick-xml.workspace = true
redb.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
tempfile.workspace = true

[[test]]
name = "admin"
path = "tests/admin/mod.rs"

[[test]]
name = "protocol"
path = "tests/protocol/mod.rs"

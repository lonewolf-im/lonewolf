[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"

[licenses]
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "aws-lc-sys", reason = "C cryptography backend" },
    { crate = "aws-lc-fips-sys", reason = "C cryptography backend" },
    { crate = "ring", reason = "C and assembly cryptography backend" },
    { crate = "openssl-sys", reason = "C cryptography backend" },
    { crate = "libsqlite3-sys", reason = "C database backend" },
    { crate = "librocksdb-sys", reason = "C++ database backend" },
    { crate = "libz-sys", reason = "C compression backend" },
    { crate = "libz-ng-sys", reason = "C compression backend" },
    { crate = "bzip2-sys", reason = "C compression backend" },
    { crate = "lzma-sys", reason = "C compression backend" },
    { crate = "zstd-sys", reason = "C compression backend" },
    { crate = "curl-sys", reason = "C HTTP backend" },
    { crate = "libgit2-sys", reason = "C Git backend" },
    { crate = "libssh2-sys", reason = "C SSH backend" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

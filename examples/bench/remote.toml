# Replace the endpoint, domain and paths with your deployment.

[target]
mode = "remote"
connect_host = "xmpp.example.test"
port = 5222
xmpp_domain = "example.test"
credentials_file = "private/credentials.json"
metrics_url = "http://metrics.example.test:9090/metrics"

[scenario]
kind = "messages"
pairs = 1
rate_per_second = 2
body_bytes = 256

[measurement]
warmup_ms = 10000
duration_ms = 60000

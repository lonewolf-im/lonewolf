# Copy this file to lonewolf.toml and uncomment the settings you want to change.
# The values shown are the defaults unless a comment identifies an example.

# [logging]

# Choose how much detail Lonewolf writes to standard error.
# Use "off", "error", "warn", "info", "debug", or "trace".
# level = "info"

# [xmpp]

# Choose the default served domain when you configure multiple hosts.
# A sole host is selected automatically; the value below is an example.
# default_host = "localhost"

# Reserve memory for reusing chunks while parsing and building stanzas.
# Choose a power of two of at least 8 MiB. Lonewolf can use additional heap
# memory when the pool is exhausted.
# stanza_pool_size_mib = 256

# Add one section for each XMPP domain served by Lonewolf.
# Defining hosts replaces the built-in host map.
# Use normalized domain names or bracketed IPv6 literals without zone identifiers.
# [hosts.localhost]

# Choose extensions included in the server build for this host.
# This list replaces the default, including when it is empty.
# Enable disco to let clients discover the features selected for this host.
# extensions = ["roster", "offline", "disco", "ping", "vcard", "carbons"]

# Quote domain names that contain dots in TOML table headers.
# The domain below is an example.
# [hosts."example.com"]

# Choose whether this host accepts authenticated streams from other XMPP domains.
# federation = true

# Stored profiles are public to authenticated local users and users of federated domains.
# extensions = ["roster", "offline", "disco", "ping", "vcard", "carbons"]

# Adjust roster limits to bound stored contacts and requests awaiting approval.
# Keep roster in this host's extension list when configuring these limits.
# [hosts."example.com".roster]
# Increase this positive count for larger address books. Each item allows up to eight groups.
# max_items = 1000
# Increase this positive byte budget for larger names and groups; stored contact keys also count.
# max_bytes = 2097152
# Limit distinct pending senders. At capacity, only existing senders can update requests.
# max_pending_subscription_requests = 100

# Adjust the number of stored messages per account to suit clients that stay offline.
# Use a positive integer. Senders receive resource-constraint when the queue reaches this limit.
# Keep offline in this host's extension list when configuring its limit.
# [hosts."example.com".offline]
# max_messages_per_account = 100

# Increase the vCard write budget for larger profiles, within 1 to 1048576 bytes.
# The budget counts serialized UTF-8 XML, including materialized
# namespace, language, and whitespace-context markup.
# The listener's complete-stanza limit can be smaller.
# Reducing this budget does not delete or hide stored profiles; new documents must fit.
# [hosts."example.com".vcard]
# max_bytes = 262_144

# Choose certificate files or automatic certificates for each host except localhost.
# Localhost uses a new self-signed certificate on each start if you omit its TLS section.
# The files provider requires both PEM paths.
# Use a leaf certificate signed with RSA PKCS#1 v1.5 or ECDSA and SHA-256, SHA-384, or SHA-512.
# Ed25519 certificates cannot provide the required SCRAM channel binding.
# Relative paths start from the directory where Lonewolf was launched.
# [hosts."example.com".tls]
# provider = "files"
# certificate_chain_path = "./certs/example.com.crt"
# private_key_path = "./certs/example.com.key"

# Use this provider-only example for automatic certificates instead of file paths.
# Selecting this provider opts in to ACME account registration and subscriber terms.
# Use a DNS domain with at least two labels; IP addresses and localhost are excluded.
# ```toml
# [hosts."example.com".tls]
# provider = "letsencrypt"
# ```

# Request trusted client certificates while keeping password authentication available.
# Both paths are required for this table. Use PEM trust anchors and current CRLs.
# These paths are example values and work with either certificate provider.
# [hosts."example.com".tls.client_auth]
# trust_anchors_path = "./certs/client-roots.pem"
# crls_path = "./certs/client-crls.pem"

# [letsencrypt]

# Choose local HTTP challenge endpoints for hosts with automatic certificates.
# Validation always reaches public port 80 on every published A and AAAA address.
# Forward that port to these endpoints when using a proxy or port mapping.
# A proxy must preserve the original Host header and request path.
# IPv6 endpoints accept IPv6 only. Local endpoints must not overlap each other,
# client endpoints, enabled server endpoints, or enabled metrics endpoints.
# listen = ["0.0.0.0:80"]

# Use a high loopback port when a local proxy forwards public port 80.
# ```toml
# [letsencrypt]
# listen = ["127.0.0.1:8080"]
# ```

# Add an explicit IPv6 endpoint when publishing an AAAA address.
# ```toml
# [letsencrypt]
# listen = ["0.0.0.0:80", "[::]:80"]
# ```

# Keep ACME accounts and certificates on durable storage across deployments.
# Relative paths start from the directory where Lonewolf was launched.
# state_path = "./data/lonewolf/acme.redb"

# Choose the HTTPS certificate authority directory.
# The exact URL selects a separate account and certificate cache.
# directory_url = "https://acme-v02.api.letsencrypt.org/directory"

# Use staging to test issuance; its certificates require separate client trust.
# ```toml
# [letsencrypt]
# directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"
# ```

# Add a PEM CA bundle when a private HTTPS directory needs extra trust.
# This optional path has no default; the value below is an example.
# ```toml
# [letsencrypt]
# ca_certificates_path = "./certs/acme-ca.pem"
# ```

# All numeric limits are positive integers.
# [limits.c2s]

# Choose the profile for listeners that do not select one.
# One configured profile is selected automatically; multiple profiles require this setting.
# default = "default"

# Limit unauthenticated client connections across all listeners.
# Choose a value that leaves file descriptors for other services.
# max_unauthenticated_connections = 1_024

# Allow enough bound resources for one account's devices and applications.
# The account allowance covers all listeners.
# max_resources_per_account = 10

# Limit distinct directed-presence recipients per bound resource on every listener.
# Increase this allowance for clients that send presence to many recipients.
# Bare and full JIDs each use a slot, including recipients that cannot receive delivery.
# max_directed_presence_recipients_per_resource = 256

# Add one section per profile and use a nonblank name.
# Without profile sections, Lonewolf uses the built-in profile shown below.
# Defining profiles replaces that built-in map; an empty map is not allowed.
# Omitted values use built-in defaults, not values from the selected default profile.
# Sharing a profile between listeners shares settings, not quota counters.
# [limits.c2s.profiles.default]

# Allow enough simultaneous connections for clients sharing one IP address.
# The allowance covers all workers of one listener.
# max_connections_per_ip = 256

# Set the largest incoming stanza to suit client payloads, including XML markup.
# Choose at least 10,000 bytes and no more than the platform allocation range.
# max_stanza_bytes = 524_288

# Limit the time from TCP accept through the TLS-protected stream opening.
# connection_establishment_timeout_secs = 10

# Limit the time from the SASL offer through authentication success.
# authentication_timeout_secs = 15

# Limit the time from authentication success through resource binding.
# resource_binding_timeout_secs = 5

# Allow users more retries when they enter passwords by hand.
# Choose between 2 and 5 retries after the first failed authentication attempt.
# authentication_retries = 2

# Allow clients more retries after resource binding failures.
# Choose between 5 and 10 retries after the first failed binding attempt.
# resource_binding_retries = 5

# Limit reconnect traffic from one IP while allowing clients behind shared NAT.
# The allowance covers all workers of one listener.
# Use per_second for the sustained event rate and burst for the bucket capacity.
# connection_attempts_per_ip = { per_second = 10, burst = 50 }

# Bound sustained stanza traffic while allowing short bursts on each connection.
# Message, presence, and IQ processing waits when the allowance is empty.
# Use per_second for the sustained event rate and burst for the bucket capacity.
# incoming_stanzas_per_connection = { per_second = 20, burst = 100 }

# Limit how quickly one connection can address new recipients.
# Clients that message many contacts at once may need a larger burst.
# Use per_second for the sustained rate and burst for the bucket capacity.
# new_recipients_per_connection = { per_second = 1, burst = 100 }

# Bound incoming XML traffic per connection, including control elements and whitespace.
# TCP and TLS overhead do not count toward this allowance.
# Reads pause when the byte allowance is empty.
# Use bytes_per_second for the sustained byte rate and burst_bytes for the bucket capacity.
# incoming_xml_per_connection = { bytes_per_second = 262_144, burst_bytes = 1_048_576 }

# [limits.c2s.profiles.internal]
# max_stanza_bytes = 1_048_576

# [limits.s2s]

# Limit inbound server connections across all listeners; excess connections are rejected.
# max_inbound_connections = 1_024

# Limit simultaneous inbound connections from one IP; excess connections are rejected.
# max_connections_per_ip = 32

# Limit connection attempts from one IP; excess attempts are rejected.
# Use per_second for the sustained event rate and burst for the bucket capacity.
# connection_attempts_per_ip = { per_second = 10, burst = 50 }

# Limit inbound streams per local and remote domain pair; excess streams are rejected.
# max_inbound_streams_per_domain = 4

# Limit stream negotiation time in seconds; unfinished negotiations are closed.
# negotiation_timeout_secs = 30

# Limit each outbound connection attempt in seconds; expired attempts fail.
# connect_timeout_secs = 10

# Limit incoming stanza bytes, including XML markup; oversized stanzas close the stream.
# Choose at least 10,000 bytes and no more than the platform allocation range.
# max_stanza_bytes = 524_288

# Limit stanza traffic per connection; processing waits when the allowance is empty.
# Use per_second for the sustained event rate and burst for the bucket capacity.
# incoming_stanzas_per_connection = { per_second = 200, burst = 2_000 }

# Limit incoming XML bytes per connection; reads pause when the allowance is empty.
# TCP and TLS overhead do not count toward this allowance.
# Use bytes_per_second for the sustained byte rate and burst_bytes for the bucket capacity.
# incoming_xml_per_connection = { bytes_per_second = 1_048_576, burst_bytes = 4_194_304 }

# Limit retained outbound domain pairs, including cached failures.
# At capacity, new pairs replace an expired cached failure or fail with resource-constraint.
# max_outbound_links = 1_024

# Limit queued stanzas per link; a full queue rejects new stanzas with resource-constraint.
# max_queued_stanzas_per_link = 512

# Limit queued bytes per link; a full queue rejects new stanzas with resource-constraint.
# max_queued_bytes_per_link = 4_194_304

# Close idle links after this many seconds without traffic.
# idle_timeout_secs = 600

# Close a link when a write cannot make progress for this many seconds.
# stalled_write_timeout_secs = 60

# Set the initial retry delay in seconds; repeated failures double it before random variation.
# failure_backoff_initial_secs = 30

# Cap the final retry delay in seconds, including random variation.
# Keep this at least as large as the initial delay.
# failure_backoff_max_secs = 900

# Add one section per TCP endpoint. These sections replace the default endpoint.
# Lonewolf requires at least one client endpoint.
# [[c2s.listeners]]

# Choose the local IP address and port for client connections.
# Use a numeric IPv4 address or a bracketed IPv6 address followed by the port.
# IPv6 endpoints accept IPv6 only. Endpoints in the same address family must not
# overlap.
# address = "0.0.0.0:5222"

# Choose the SASL mechanisms this endpoint offers and accepts after TLS.
# Include at least one mechanism.
# EXTERNAL requires a verified client certificate for the selected host.
# Listeners that offer only EXTERNAL need client certificate trust configured for every host.
# auth_mechanisms = ["EXTERNAL", "SCRAM-SHA-256-PLUS", "SCRAM-SHA-256", "SCRAM-SHA-1-PLUS", "SCRAM-SHA-1"]

# Select a named limit profile for this endpoint.
# Omit this setting to use limits.c2s.default; the value below is an example.
# limits = "default"

# This example local endpoint uses the internal profile defined above.
# [[c2s.listeners]]
# address = "127.0.0.1:5223"
# limits = "internal"

# [s2s]

# Accept authenticated streams from other XMPP domains for hosts with a configured
# certificate and a public domain name. Hosts without a certificate stay local.
# No listener opens while no host federates.
# enabled = true

# Choose local endpoints for connections from other XMPP servers.
# These sections replace the default endpoint and need at least one entry when enabled.
# [[s2s.listeners]]
# IPv6 endpoints accept IPv6 only; port zero selects one port shared by all workers.
# Endpoints must not overlap each other, client endpoints, enabled metrics,
# or HTTP challenge endpoints for hosts with automatic certificates.
# address = "0.0.0.0:5269"

# [s2s.tls]

# Replace the bundled public roots with one PEM bundle for a private federation.
# This optional path has no default; the value below is an example.
# trust_anchors_path = "./certs/federation-roots.pem"

# [s2s.dns]

# Override /etc/resolv.conf with numeric DNS server addresses and ports.
# nameservers = []

# Limit DNS lookup time in seconds; a lookup fails when this time expires.
# timeout_secs = 5

# [s2s.routes]

# Use fixed endpoints for a domain instead of DNS.
# Peer certificates are still checked against the domain name.
# Each domain needs at least one endpoint with a nonzero port; this value is an example.
# "remote.example" = ["127.0.0.1:5269"]

# [storage]

# Choose the store Lonewolf uses by default.
# You only need this setting when you configure more than one store.
# default = "primary"

# Add one section for each database and replace "primary" with a unique name.
# Without any store sections, Lonewolf uses the "primary" store shown below.
# Defining a store replaces that built-in store.
# [storage.stores.primary]

# Choose the database engine for this store. Lonewolf supports Redb.
# backend = "redb"

# Choose where Redb keeps this database. Relative paths start from the directory
# where Lonewolf was launched.
# path = "./data/lonewolf.dat"

# [admin]

# Enable the local HTTP API used to manage accounts.
# Access is controlled only by the Unix socket permissions.
# enabled = true

# Choose where Lonewolf creates the administration socket. Relative paths start
# from the directory where Lonewolf was launched.
# Lonewolf will not replace an existing file at this path. The parent directory
# must belong to the user running Lonewolf and must not grant access to others.
# socket_path = "./run/lonewolf/admin.sock"

# [metrics]

# Serve Prometheus metrics at /metrics for a scraper or collection agent.
# The endpoint has no authentication, so bind it to a loopback or private address.
# enabled = false

# Choose the local IP address and port for the metrics endpoint.
# Use a numeric IPv4 address or a bracketed IPv6 address followed by the port.
# This address must not overlap a client endpoint or an enabled server endpoint.
# address = "127.0.0.1:9520"

# [account]

# Choose where Lonewolf stores account records and credentials.
# Leave this unset to use the default store. The value below is an example.
# storage = "primary"

# Copy this file to lonewolf.toml and uncomment the sections and values you need.
# The values below are the defaults. Omitted settings use their defaults.

# [logging]

# Log events at this level and more severe levels. Applied at startup.
# Accepted values: "off", "error", "warn", "info", "debug", "trace".
# Use "off" to disable logs. The default is "info".
# level = "info"

# [admin]

# Enable the admin server. Set to false to disable it.
# enabled = true

# IP address and port for the admin listener.
# The default permits connections from this machine only.
# Use a numeric IP address. Put IPv6 addresses in brackets, as in "[::1]:8080".
# listen_addr = "127.0.0.1:8080"

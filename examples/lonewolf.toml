# Copy this file to lonewolf.toml and uncomment the sections and values you need.
# Omitted settings use their defaults. Values below are defaults unless marked as examples.

# [logging]

# Log events at this level and more severe levels. Applied at startup.
# Accepted values: "off", "error", "warn", "info", "debug", "trace".
# Use "off" to disable logs. The default is "info".
# level = "info"

# [storage]

# Default store for components that do not select a store.
# Must name a store defined below. Required when more than one store is defined.
# Omit to select the only store. The built-in store is "primary".
# default = "primary"

# Define each store once under storage.stores.<name>. Names must not be empty.
# Omit all store definitions to use the primary store shown below.
# Explicit store definitions replace the built-in store list.
# Stores are opened only when used.
# [storage.stores.primary]

# Storage backend. Required for each explicit store. Only "redb" is supported.
# backend = "redb"

# Database file path. Required and nonempty for each explicit redb store.
# Relative paths use the working directory. Missing parent directories are created.
# The built-in primary store uses this path.
# path = "./data/lonewolf.dat"

# [account]

# Optional store override. Omit to inherit storage.default.
# storage = "primary"

# [admin]

# Enable the admin server. Default: true.
# enabled = true

# Unix socket path for the HTTP/JSON admin API. TCP is not supported.
# Default: ./run/lonewolf/admin.sock. Relative paths use the working directory.
# The parent directory must be private (0700) and owned by the server user.
# Missing directories are created with mode 0700; the socket uses mode 0600.
# Existing paths are rejected. Remove a stale socket only after stopping its server.
# The socket is removed on graceful shutdown.
# socket_path = "./run/lonewolf/admin.sock"
